<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IoT Assistant Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <h1>IoT Asistan</h1>
            <p>Dashboard</p>
        </header>

        <main>
            <div class="status-card glass">
                <div id="status-indicator" class="indicator online"></div>
                <span id="status-text">Durum</span>
            </div>

            <div class="voice-section">
                <button id="voice-btn" class="voice-btn glass">
                    <div class="mic-icon">
                        <svg viewBox="0 0 24 24" fill="currentColor">
                            <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
                            <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
                        </svg>
                    </div>
                </button>
                <p id="instruction">Konuşmak için basılı tut</p>
            </div>

            <div class="events-card glass">
                <h2>Yaklaşan Etkinlikler</h2>
                <div id="events-list" class="events-list">
                    <p class="loading">Etkinlikler yükleniyor...</p>
                </div>
            </div>

            <div class="settings-card glass" style="margin-top: 16px;">
                <div class="setting-item">
                    <span>Robot Kol</span>
                    <label class="switch">
                        <input type="checkbox" id="servo-toggle" checked>
                        <span class="slider round"></span>
                    </label>
                </div>
                <div class="setting-item" style="border-top: 1px solid rgba(255,255,255,0.1);">
                    <span>Ses Efektleri (Buzzer)</span>
                    <label class="switch">
                        <input type="checkbox" id="buzzer-toggle" checked>
                        <span class="slider round"></span>
                    </label>
                </div>
            </div>
        </main>
    </div>
    <script src="app.js"></script>
</body>
</html>
